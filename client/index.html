<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clock me Out</title>
    <meta name="theme-color" content="#EAF4FC" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Clock me Out" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>try{var b=document.body,t=localStorage.getItem('cmoTheme'),c=localStorage.getItem('cmoThemeColor');if(t==='dark')b.classList.add('dark-mode');if(c&&/^[a-z]+$/.test(c)&&c!=='ocean')b.classList.add('theme-'+c)}catch(e){}</script>
    <div id="root">
      <main class="clk-boot" role="status" aria-live="polite"><div class="clk-load">
<svg class="clk-logo" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <defs><linearGradient id="clkG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--sky,#4FA8E8)"/><stop offset="1" style="stop-color:var(--sky-dark,#2D7FC4)"/></linearGradient></defs>
          <rect width="100" height="100" rx="22" fill="url(#clkG)"/>
          <rect x="20" y="22" width="60" height="48" rx="9" fill="#fff"/>
          <rect x="24.5" y="26.5" width="51" height="39" rx="5.5" style="fill:var(--hero-a,#0B2A4A)"/>
          <circle cx="50" cy="46" r="15.5" fill="none" stroke="#7CC4FF" stroke-width="3.4"/>
          <g transform="rotate(-90 50 46)"><circle class="clk-arc" cx="50" cy="46" r="15.5" fill="none" stroke="#FFC93C" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="26 71.4"/></g>
          <g class="clk-hr"><path d="M50 46l7 4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g>
          <g class="clk-min"><path d="M50 46V35.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g>
          <circle cx="50" cy="46" r="2" fill="#fff"/>
          <rect x="44" y="70" width="12" height="6" fill="#fff"/>
          <rect x="34" y="76" width="32" height="4.5" rx="2" fill="#fff"/>
          <circle class="clk-led" cx="73" cy="67.8" r="1" fill="#FFC93C"/>
        </svg>
        <div class="clk-word">Clock me Out</div>
        <div class="clk-msg">Loading<span class="clk-dots" aria-hidden="true"><i></i><i></i><i></i></span></div>
      </div></main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
